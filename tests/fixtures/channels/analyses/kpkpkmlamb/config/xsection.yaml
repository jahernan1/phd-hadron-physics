xsection:
  mc_sample: ximstar_synthetic
  weight: best_combo
  inputs:
    data: "${GXANA_DATA}/kpkpkmlamb/flatTree_{stem}_nominal_allCuts.root"
    mc: "${GXANA_DATA}/kpkpkmlamb/flatTree_{mc_stem}_nominal_allCuts.root"
    thrown: "${GXANA_DATA}/kpkpkmlamb/flatTree_thrown_{mc_stem}.root"
    flux_dir: "${GXANA_DATA}/flux"
  output_dir: "${GXANA_OUTPUT}/kpkpkmlamb/xsection"
  fit_plots: "${GXANA_OUTPUT}/kpkpkmlamb/xsection/fits"
  fits:
    - model: Johnson
      params: {mu: [1.823, 1.81, 1.835], lambda: [0.01, 0.005, 0.03], gamma: [0.0, -0.5, 0.5], delta: [1.0, 0.2, 1.5]}
      labels: [{label: nominal, cheby: 2}, {label: nominal_cheby1, cheby: 1}]
  weighted_labels: [nominal]
  component_labels: [nominal]
  tex:
    label: nominal
    output: "${GXANA_OUTPUT}/kpkpkmlamb/xsection/tables/diffxsec_table.tex"
    columns:
      Run Combination: "${GXANA_OUTPUT}/kpkpkmlamb/systematics/run/sfactor_stats.txt"
  figures:
    output_dir: "${GXANA_OUTPUT}/kpkpkmlamb/xsection/figures"
    label: nominal
    plots:
      - macro: xsection/PlotDiffXSec.C
        args: ["${GXANA_OUTPUT}/kpkpkmlamb/xsection", nominal, "${GXANA_OUTPUT}/kpkpkmlamb/xsection/figures"]
  binned_suffix: _nominal_allCuts
  gate: "(best_combo)*(ximstar_M>1.80&&ximstar_M<1.84)"
  target: {z: [50.4, 79.1], density: 70.08e-3, molar_mass: 2.01588, atoms: 2}
  branches: [beam_E, chisqndf, total_mm2, beam_vertexZ, kp_highp_P3, kp_lowp_P3, ximstar_M, t_dist,
             best_combo, acc_weight]
  mass_windows: {lo: 1.70, mc_hi: 1.95, mc_signal_hi: 1.92, mc_plot_hi: 1.96, data_hi: 2.00,
                 data_edge: 1.71, mcpdf_data_lo: 1.705}
