# Barlow cut-variation systematics (legacy AnalysisNote/systematics UML chain).
systematics:
  label: johnson   # nominal label: Barlow plots compare against xsection/weighted_data/<label>; variation outputs go to systematics/{xsection_data,weighted_data}/<label>/
  cuts: [chisqndf, total_mm2_abs, xim_pathlensig, lambda_pathlensig, kphigh_prap]
  variation_trees: "${GXANA_OUTPUT}/kpkpxim/systematics/variation_trees/flatTree_{stem}_{cut}_{mc_sample}_variations.root"
  output_dir: "${GXANA_OUTPUT}/kpkpxim/systematics"
  weight: hybrid_combo
  fit:   # legacy GetXSecFilesUML.C variation fit; start values = its xiParams {1.3217, 0.004, -0.01, 1.2}, ranges = its RooFitHistMC literals
    model: JohnsonMCShapeSyst
    params: {mu: [1.3217, 1.32, 1.33], lambda: [0.004, 0.002, 0.007], gamma: [-0.01, -0.5, 0.5], delta: [1.2, 0.2, 1.5]}
    cheby: 2
  # Macros of analyses/kpkpxim/systematics/, each called as macro("<label>").
  barlow_macros: [barlow/PlotXSecBarlowChiSqNdf.C, barlow/PlotXSecBarlowMissingMass.C, barlow/PlotXSecBarlowKHighRapidity.C, barlow/PlotXSecBarlowKLowRapidity.C, barlow/PlotXSecBarlowXimFlightSig.C, barlow/PlotXSecBarlowLambdaFlightSig.C]
