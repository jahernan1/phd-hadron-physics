# Cross-section chain (legacy MakeBinnedTrees.C, MakeXSecFiles.C and
# MakeXSecFitVariations.C mains, GetWeightedXsecFile.py,
# GetXSecComponentFiles.py, MakeQValXSecFile.py).
xsection:
  mc_sample: gen_amp_V2_ac_YstarRest
  # Default event-weight branch (combo selection; hybrid_combo =
  # best_combo_rf * acc_weight). A fit label may set its own `weight`.
  weight: hybrid_combo
  inputs:
    data: "${GXANA_OUTPUT}/kpkpxim/qfactors/{stem}_nominal_kphighrap_1111111/postQVal_flatTree_{stem}_nominal_kphighrap_1111111.root"
    mc: "${GXANA_DATA}/flatTrees/flatTree_{mc_stem}_nominal_kphighrap.root"
    thrown: "${GXANA_DATA}/flatTrees/flatTree_thrown_{mc_stem}.root"
    # Tagged photon flux: never produced by a stage (hd_utilities psflux at JLab,
    # xsection/flux/README.md), so read from the preserved data.
    flux_dir: "${GXANA_ANALYSIS_DATA}/kpkpxim/flux"
  output_dir: "${GXANA_OUTPUT}/kpkpxim/xsection"
  # Per-bin fit PDFs written by gxana_xsec_tables --plots, one subdirectory per label.
  fit_plots: "${GXANA_OUTPUT}/kpkpxim/xsection/fits"
  # One gxana_xsec_tables process per fit. The dissertation result: Johnson +
  # 2nd-order Chebychev, weight hybrid_combo (legacy MakeXSecFitVariations.C,
  # Jul 2025). Systematic variants (accidental-subtraction methods, fit models,
  # Q-value yield) live in systematics.yaml.
  fits:
    - model: Johnson
      params: {delta: [1.0, 0.2, 1.5], gamma: [0.0, -0.5, 0.5], lambda: [0.004, 0.003, 0.01], mu: [1.3217, 1.31, 1.33]}
      labels: [{label: johnson, cheby: 2}]
  weighted_labels: [johnson]
  component_labels: [johnson]
  # Dissertation LaTeX tables. Each systematic column is the last column of a
  # gxana run systematics stats file (each spread under its own source;
  # the published tables swap Accidentals and Yield Extraction, KNOWN_ISSUES.md).
  tex:
    label: johnson
    output: "${GXANA_OUTPUT}/kpkpxim/xsection/tables/diffxsec_table_scale.tex"
    run_fraction: 0.051   # run_fraction source only (*_runsyst study tables); no documentary source
    columns:
      Run Combination: "${GXANA_OUTPUT}/kpkpxim/systematics/run/sfactor_stats.txt"
      Accidentals: "${GXANA_OUTPUT}/kpkpxim/systematics/accidentals/combo_variations_stats.txt"
      Yield Extraction: "${GXANA_OUTPUT}/kpkpxim/systematics/fit/fit_variations_stats.txt"
  # Dissertation chapter-6 figures (`--steps figures`, opt-in, after `tex`). First
  # gxana_xsection.syst_tables writes syst_weighted_diffxsec_*.txt beside the weighted
  # tables of `label`: the total systematic, the quadrature sum of `columns` in order
  # (default: tex.columns, the regenerated systematics; a value `scale_factor` is the run
  # systematic dy*S - dy from the table's own S column, the legacy published band).
  # Then each plot macro (analyses/<channel>/<macro>, ${VAR}s in args expanded) runs from
  # output_dir; `requires` lists inputs checked first.
  figures:
    output_dir: "${GXANA_OUTPUT}/kpkpxim/xsection/figures"
    label: johnson
    plots:
      # diffxsec_runs_johnson.pdf, diffxsec_phase1_systematics_johnson.pdf
      # (+ diffxsec_phase1_weighted_johnson.pdf)
      - macro: xsection/PlotDiffXSec.C
        args: ["${GXANA_OUTPUT}/kpkpxim/xsection", johnson, "${GXANA_OUTPUT}/kpkpxim/xsection/figures"]
        requires: ["${GXANA_OUTPUT}/kpkpxim/xsection/data/johnson"]
      # totxsec_clas_gluex_Phase1.pdf as published: the direct total of the JohnsonMCShape
      # study tables, systematics variant hybrid_combo (the dissertation figure was drawn from
      # that label, not from the published johnson tables; docs/KNOWN_ISSUES.md section 12).
      - macro: xsection/PlotTotXsecWithClas.C
        args: ["${GXANA_OUTPUT}/kpkpxim/systematics/variants", hybrid_combo, "${GXANA_OUTPUT}/kpkpxim/xsection/figures"]
        requires: ["${GXANA_OUTPUT}/kpkpxim/systematics/variants/data/hybrid_combo",
                   "${GXANA_OUTPUT}/kpkpxim/systematics/variants/weighted_data/hybrid_combo/totxsec_weighted_output.txt"]
  # Binned-tree file names: binned_flatTree_<stem><binned_suffix>.root.
  binned_suffix: _nominal_kphighrap
  # A bin is fitted only if its data tree has enough entries passing this selection
  # (legacy FitFunctions.cpp: hybrid_combo whatever the label's weight; KNOWN_ISSUES.md).
  gate: "(hybrid_combo)*(decayxim_M>1.3&&decayxim_M<1.35)"
  # Liquid-hydrogen target: z range (cm), density (g/cm^3, the 2018 value, used for every
  # period), molar mass (g/mol), atoms per molecule.
  target: {z: [50.4, 79.1], density: 70.08e-3, molar_mass: 2.01588, atoms: 2}
  # Columns of the binned trees (legacy MakeBinnedTrees.cpp list, repeats removed); data
  # trees also keep physics.qvalue_branch.
  branches: [beam_E, chisqndf, total_mm2, xim_pathlensig, lambda_pathlensig, kphigh_p4, kplow_p4,
             beam_vertexZ, hybrid_combo, kphigh_prapidity, kplow_prapidity, beam_E_Truth, beam_p4_truth,
             decayxim_M, xim_costheta_gen_amp, xim_costheta_hf, t_dist, t_dist_truth, confidencelvl,
             best_combo, best_combo_rf, acc_weight, xim_lifetime_restframe, lambda_lifetime_restframe,
             decayxim_p4, ystar_p4]
  # Yield-fit mass windows (GeV): fit variable / range / plot edges of the MC and data fits
  # (legacy FitFunctions.cpp, MakeXSecFiles.C, MakeXSecFitMC.C).
  mass_windows: {lo: 1.27, mc_hi: 1.40, mc_signal_hi: 1.38, mc_plot_hi: 1.42, data_hi: 1.45,
                 data_edge: 1.28, mcpdf_data_lo: 1.275}
