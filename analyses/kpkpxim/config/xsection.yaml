# Cross-section chain (legacy MakeBinnedTrees.C, MakeXSecFiles.C and
# MakeXSecFitVariations.C mains, GetWeightedXsecFile.py,
# GetXSecComponentFiles.py, MakeQValXSecFile.py).
xsection:
  mc_sample: gen_amp_V2_ac_YstarRest
  # Default event-weight branch (combo selection; hybrid_combo =
  # best_combo_rf * acc_weight). A fit label may set its own `weight`.
  weight: hybrid_combo
  inputs:
    data: "${GXANA_OUTPUT}/kpkpxim/qfactors/{stem}_nominal_kphighrap_1111111/postQVal_flatTree_{stem}_nominal_kphighrap_1111111.root"
    mc: "${GXANA_DATA}/flatTrees/flatTree_{mc_stem}_nominal_kphighrap.root"
    thrown: "${GXANA_DATA}/flatTrees/flatTree_thrown_{mc_stem}.root"
    flux_dir: "${GXANA_DATA}/flux"
  output_dir: "${GXANA_OUTPUT}/kpkpxim/xsection"
  # Per-bin fit PDFs written by gxana_xsec_tables --plots, one subdirectory per label.
  fit_plots: "${GXANA_OUTPUT}/kpkpxim/xsection/fits"
  # One gxana_xsec_tables process per fit. The dissertation result: Johnson +
  # 2nd-order Chebychev, weight hybrid_combo (legacy MakeXSecFitVariations.C,
  # Jul 2025). Systematic variants (accidental-subtraction methods, fit models,
  # Q-value yield) live in systematics.yaml.
  fits:
    - model: Johnson
      params: {delta: [1.0, 0.2, 1.5], gamma: [0.0, -0.5, 0.5], lambda: [0.004, 0.003, 0.01], mu: [1.3217, 1.31, 1.33]}
      labels: [{label: johnson, cheby: 2}]
  weighted_labels: [johnson]
  component_labels: [johnson]
  # Dissertation LaTeX tables. Each systematic column is the last column of a
  # gxana run systematics stats file (D1: each spread under its own source;
  # the published tables swap Accidentals and Yield Extraction, KNOWN_ISSUES.md).
  tex:
    label: johnson
    output: "${GXANA_OUTPUT}/kpkpxim/xsection/tables/diffxsec_table_scale.tex"
    run_fraction: 0.051   # run_fraction source only (*_runsyst study tables); no documentary source (D8)
    columns:
      Run Combination: "${GXANA_OUTPUT}/kpkpxim/systematics/run/sfactor_stats.txt"
      Accidentals: "${GXANA_OUTPUT}/kpkpxim/systematics/accidentals/combo_variations_stats.txt"
      Yield Extraction: "${GXANA_OUTPUT}/kpkpxim/systematics/fit/fit_variations_stats.txt"
