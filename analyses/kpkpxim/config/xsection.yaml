# Cross-section chain (legacy MakeBinnedTrees.C, MakeXSecFiles.C and
# MakeXSecFitVariations.C mains, GetWeightedXsecFile.py,
# GetXSecComponentFiles.py, MakeQValXSecFile.py).
xsection:
  mc_sample: gen_amp_V2_ac_YstarRest
  # Default event-weight branch (combo selection; hybrid_combo =
  # best_combo_rf * acc_weight). A fit label may set its own `weight`.
  weight: hybrid_combo
  inputs:
    data: "${GXANA_OUTPUT}/kpkpxim/qfactors/{stem}_nominal_kphighrap_1111111/postQVal_flatTree_{stem}_nominal_kphighrap_1111111.root"
    mc: "${GXANA_DATA}/flatTrees/flatTree_{mc_stem}_nominal_kphighrap.root"
    thrown: "${GXANA_DATA}/flatTrees/flatTree_thrown_{mc_stem}.root"
    flux_dir: "${GXANA_DATA}/flux"
  output_dir: "${GXANA_OUTPUT}/kpkpxim/xsection"
  # Per-bin fit PDFs written by gxana_xsec_tables --plots, one subdirectory per label.
  fit_plots: "${GXANA_OUTPUT}/kpkpxim/xsection/fits"
  # Fit label whose tables the qvalue step rescales by the Q-factor yield
  # (dsigma/dt * qval_yield/data_yield; qval_yield = sum of weight *
  # qvalue_decayxim_M from QFactors), as legacy MakeQValXSecFile.py did with
  # data/hybrid_combo (the JohnsonMCShape study fit, not the dissertation
  # `johnson` label; kept so the rescale matches the legacy input).
  qvalue_source: hybrid_combo
  # One gxana_xsec_tables process per fit: its labels share one parameter set
  # in order (legacy johnson -> johnson_cheby1 carry-over). Order matters.
  fits:
    # JohnsonMCShape study (legacy MakeXSecFiles.C, Mar 2025): per bin, a Johnson fit to
    # MC (these start,min,max) fixes skewness gamma and tail delta (and lambda's
    # floor) for the data fit, Johnson + 2nd-order Chebychev. No carry-over
    # between bins. One label per combo-selection weight, as legacy
    # data/<accType>/. Not the dissertation result (label johnson below).
    - model: JohnsonMCShape
      params: {mu: [1.3217, 1.32, 1.33], lambda: [0.004, 0.002, 0.007], gamma: [-0.01, -1.0, 1.0], delta: [1.2, 0.2, 5.0]}
      labels:
        - {label: hybrid_combo, cheby: 2, weight: hybrid_combo}
        - {label: best_combo, cheby: 2, weight: best_combo}
        - {label: acc_weight, cheby: 2, weight: acc_weight}
    # Dissertation fit and fit-model systematic variations, all with weight
    # hybrid_combo (legacy MakeXSecFitVariations.C, Jul 2025). The published
    # tables are label johnson (Johnson + 2nd-order Chebychev).
    - model: Johnson
      params: {delta: [1.0, 0.2, 1.5], gamma: [0.0, -0.5, 0.5], lambda: [0.004, 0.003, 0.01], mu: [1.3217, 1.31, 1.33]}
      labels: [{label: johnson, cheby: 2}, {label: johnson_cheby1, cheby: 1}]
    - model: Voigtian
      params: {sigma: [0.002, 0.001, 0.018], width: [0.004, 0.001, 0.008], mean: [1.3217, 1.32, 1.33]}
      labels: [{label: voigt, cheby: 2}, {label: voigt_cheby1, cheby: 1}]
    # Signal shape taken from the MC mass PDF (no free shape parameters), with
    # 2nd- and 1st-order Chebychev backgrounds; weight hybrid_combo.
    - model: MCPdf
      params: {}
      labels: [{label: mcPdf, cheby: 2}, {label: mcPdf_cheby1, cheby: 1}]
  weighted_labels: [hybrid_combo, best_combo, acc_weight, johnson, johnson_cheby1, voigt, voigt_cheby1, mcPdf, mcPdf_cheby1]
  component_labels: [hybrid_combo, best_combo, acc_weight, johnson]
  # Dissertation LaTeX tables (legacy MakeXsecTexTableScale.py): the weighted
  # `johnson` tables with the scale-factor run systematic plus the fit-model
  # and combo-selection spreads written by systematics/comparisons/
  # PlotFitComparison.C and PlotComboComparison.C (in that order).
  tex:
    label: johnson
    systematic_source: scale_factor
    additional: ["${GXANA_OUTPUT}/kpkpxim/systematics/comparisons/fit_variations_stats.txt", "${GXANA_OUTPUT}/kpkpxim/systematics/comparisons/combo_variations_stats.txt"]
    output: "${GXANA_OUTPUT}/kpkpxim/xsection/tables/diffxsec_table_scale.tex"
