# GlueX Phase-I run periods. launch = analysis-launch tag in the tree directory
# name; fit_prefix = ReactionFilter flags prefix; runs = flux run range;
# flux = tagged-flux file name under the preserved analysis data ($GXANA_ANALYSIS_DATA/kpkpxim/flux); label = short tag (sp17, ...);
# dir = the period's directory name inside the macros' ROOT files (gxana::MakePeriods,
# GetPeriodHists, measurements/common/XimInputs.h); title = readable name for plot labels.
# label, dir and title are required: `gxana config export` writes them to channel.kv
# (period.<period>.<key>, read in C++ by gxana::ChannelInfo::PeriodValue).
periods:
  "2017-01": {launch: ana56, fit_prefix: "M23_", label: sp17, runs: [30274, 31057], flux: flux_30274_31057_r4.root, dir: Spring_2017, title: "Spring 2017"}
  "2018-01": {launch: ana03, fit_prefix: "B4_M23_", label: sp18, runs: [40856, 42559], flux: flux_40856_42559.root, dir: Spring_2018, title: "Spring 2018"}
  "2018-08": {launch: ana02, fit_prefix: "B4_M23_", label: fa18, runs: [50685, 51768], flux: flux_50685_51768.root, dir: Fall_2018, title: "Fall 2018"}
