# Prep and fit macros of `gxana run measurements --channel kpkpxim`, run from output_dir;
# args [0] = n_threads 0 (single-threaded). See ../measurements/README.md.
measurements:
  output_dir: "${GXANA_OUTPUT}/kpkpxim/measurements"
  make_dirs: ["${GXANA_OUTPUT}/kpkpxim/prod_plots"]
  items:
    mass:     {prep: {macro: measurements/mass/PrepMass.C, args: [0]}, fit: {macro: measurements/mass/FitMass.C, args: [0]}}
    lifetime: {prep: {macro: measurements/lifetime/PrepLifetime.C, args: [0]}, fit: {macro: measurements/lifetime/FitLifetime.C, args: [0]}}
    spin:     {prep: {macro: measurements/spin/PrepSpinData.C, args: [0]}, fit: {macro: measurements/spin/PlotGlueXSpin.C, args: [0]}}
