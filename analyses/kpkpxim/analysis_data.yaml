# Preserved data for the kpkpxim thesis analysis (docs/analysis_data.md).
# Files live under $GXANA_ANALYSIS_DATA/<subdir>/ and never in git; at JLab
# the deposit follows the GlueX convention /work/halld/gluex_analysis_data/.
# `gxana data status --channel kpkpxim` checks them; `gxana data lock
# --channel kpkpxim` records sha256 + bytes (commit the updated manifest).
# Tree stems <P>: kpkpxim__M23_2017-01_ana56, kpkpxim__B4_M23_2018-01_ana03,
# kpkpxim__B4_M23_2018-08_ana02.
subdir: kpkpxim
directories:
  flat_trees: 'Binning inputs. postQVal_flatTree_<P>_nominal_kphighrap_1111111.root: data after nominal cuts with Q-factor weights (QFactors output); flatTree_<P>_gen_amp_V2_ac_YstarRest_nominal_kphighrap.root: reconstructed signal MC; flatTree_thrown_<P>_gen_amp_V2_ac_YstarRest.root: thrown signal MC.'
  binned_trees: Legacy MakeBinnedTrees output from flat_trees (8 E_gamma x 7 -t bins); reference for binning and input to the yield fits.
  flux: Tagged photon flux (hd_utilities psflux plot_flux_ccdb.py, 500 bins, 6.4-11.4 GeV, histogram tagged_flux) for runs 30274-31057 (-r 4), 40856-42559, 50685-51768.
  reference/xsection/johnson: 'Legacy MakeXSecFitVariations.C tables (Jul 2025), the dissertation cross-section fit (Johnson signal + 2nd-order Chebychev background), weight hybrid_combo, periods processed 2017-01, 2018-01, 2018-08.'
  reference/xsection/hybrid_combo: 'JohnsonMCShape study: legacy MakeXSecFiles.C (Mar 2025) tables, weight hybrid_combo, per-bin Johnson fit to MC fixing the shape (gamma, delta) of a Johnson + 2nd-order Chebychev data fit (gxana fit JohnsonMCShape); not the dissertation tables. Input to the runsyst tables, the components and the Q-value rescale.'
  reference/xsection/best_combo: 'JohnsonMCShape combo-selection study: the same MakeXSecFiles.C fit with weight best_combo.'
  reference/xsection/acc_weight: 'JohnsonMCShape combo-selection study: the same MakeXSecFiles.C fit with weight acc_weight.'
  reference/xsection/weighted/hybrid_combo: Legacy GetWeightedXsecFile.py output from reference/xsection/hybrid_combo (JohnsonMCShape study), with the processed_*/syst_* files MakeXsecTexTable.py writes beside its input.
  reference/xsection/weighted/best_combo: Legacy GetWeightedXsecFile.py output from reference/xsection/best_combo.
  reference/xsection/weighted/acc_weight: Legacy GetWeightedXsecFile.py output from reference/xsection/acc_weight.
  reference/xsection/tables: 'LaTeX tables and systematics inputs. Dissertation tables: diffxsec_table_scale.tex and syst_diffxsec_table_scale.tex (legacy MakeXsecTexTableScale.py on reference/xsection/weighted/johnson, scale-factor run systematic, plus fit_variations_stats.txt and combo_variations_stats.txt). JohnsonMCShape study: diffxsec_table_runsyst.tex and syst_diffxsec_table_runsyst.tex (MakeXsecTexTable.py on reference/xsection/weighted/hybrid_combo, same additional files).'
  reference/xsection/qvalues: 'Legacy MakeQValXSecFile.py output: hybrid_combo dsigma/dt scaled by qval_yield/data_yield.'
  reference/xsection/weighted/johnson: 'Legacy GetWeightedXsecFile.py output: error-weighted average of the three periods (dissertation tables), with the syst_weighted_* files the scale-factor tex step writes beside its input.'
  reference/xsection/components: Legacy GetXSecComponentFiles.py output per period label (sp17, sp18, fa18) and fit label (hybrid_combo, best_combo, acc_weight, johnson).
  reference/systematics/xsection_data: Legacy systematics/GetXSecFilesUML.C totxsec/diffxsec tables per variation cut and run period, input to the systematics GetWeightedXsecFile.py.
  reference/systematics/weighted_data: 'Legacy systematics/GetWeightedXsecFile.py output: error-weighted average of the three periods per variation cut (4-column format, distinct from reference/xsection/weighted/johnson).'
  reference/barlow/plots: Barlow plots made by the archived PlotXSecBarlow*.C macros (ChiSqNdf, MissingMass, XimFlightSig, LambdaFlightSig, KHighRapidity) from reference/xsection/weighted/johnson and reference/systematics/weighted_data (tests/golden/make_barlow_reference_plots.py); gxana_barlow_plot is pixel-compared against them.
  simulation/sampling: gen_amp_V2 Hist2D sampling inputs (CosThetaVsMass, hist ResMassVsCosTheta_Phase1_ac / ResMassVsCosTheta_qval_Phase1) read by simulation/gen_amp_cfg/kpkpxim_2dhist_{ac,noac}_YstarRest.cfg; made by simulation/sampling/PrepSampling.C.
