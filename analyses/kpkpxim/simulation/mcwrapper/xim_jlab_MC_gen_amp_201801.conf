# gxana: template -- paths use GXANA_* variables; render with gxana run mc (analyses/kpkpxim/simulation/README.md).
#THESE TWO ARE OPTIONAL IF THE STANDARD RUNNING DOESN'T SUIT YOUR NEEDS
#CUSTOM_MAKEMC=${GXANA_ROOT}/analyses/kpkpxim/simulation/MakeMC.csh
#CUSTOM_GCONTROL=use-this-Gcontrol-instead
#========================================================================

#VARIATION=mc calibtime=timegoeshere #set your jana calib context here with or without calibtime Default is variation=mc
#RECON_CALIBTIME=timegoeshere

RCDB_QUERY=@is_2018production and @status_approved

#RUNNING_DIRECTORY=${GXANA_OUTPUT}/kpkpxim/mc #where the code should run.  This is defaulted to ./.  Use only when NEEDED

#ccdbSQLITEPATH=/your/sqlite/path/ccdb.sqlite  #if you use SQLITE and it is not part of the environment file that gets sourced # gxana: disabled example path anonymized (was a site-specific path, unused)
#rcdbSQLITEPATH=/your/sqlite/path/rcdb.sqlite  #if you use SQLITE and it is not part of the environment file that gets sourced

#TAG=kpkpxim

DATA_OUTPUT_BASE_DIR=${GXANA_OUTPUT}/kpkpxim/mc/tree_kpkpxim__B4_M23_2018-01_ana03_gen_amp_V2_2D_ac_YstarRest/  #your desired output location

NCORES=2      # Number of CPU threads to use or nodes:node-id:ppn or nodes:ppn depending on your system

GENERATOR=gen_amp_V2 #or you may specifile file:/.../file-to-use.hddm
GENERATOR_CONFIG=${GXANA_ROOT}/analyses/kpkpxim/simulation/gen_amp_cfg/kpkpxim_2dhist_ac_YstarRest.cfg
#GENERATOR_POSTPROCESS=decay_evtgen:default:${GXANA_ROOT}/analyses/kpkpxim/simulation/myevt.pdl:${GXANA_ROOT}/analyses/kpkpxim/simulation/MYDECAY.DEC # last two are optional (set 2nd to default if only 3rd is used), eg evtgen:/u/home/evtgen.cfg:default:someOther.DEC

#common parameters for generators
FLUX_TO_GEN=ccdb
#POL_TO_GEN=/[full path]/tpol.root:pol_hist
#eBEAM_ENERGY=12 #either use rcdb or do not set to pull the value for the chosen run number from the rcdb
#eBEAM_CURRENT=0.01 #either use rcdb or do not set to pull the value for the chosen run number from the rcdb in uA
#RADIATOR_THICKNESS=50.e-06#either use rcdb or do not set to pull the value for the chosen run number from the rcdb
#COHERENT_PEAK=9 #either use rcdb or do not set to pull the value for the chosen run number from the rcdb
GEN_MIN_ENERGY=6.3
GEN_MAX_ENERGY=11.5
#Specify particle indices for gen_amp_V2
UPPER_VERTEX_INDICES=1
LOWER_VERTEX_INDICES=23

GEANT_VERSION=4
BKG=Random:recon-2018_01-ver02.2 #[None, Random:[TAG], BeamPhotons, TagOnly, custom e.g bg.hddm:1.8] Can be stacked eg Random:[TAG]+TagOnly:.123 where the :[num] defines BGRATE

ANA_ENVIRONMENT_FILE=/group/halld/www/halldweb/html/halld_versions/analysis-2018_01-ver03.xml #optional either a .(c)sh file to be sourced or .xml before the below plugins are run

#optional additional plugins that will be run along side danarest and hd_root.  This should be a comma separated list (e.g. plugin1,plugin2)
CUSTOM_PLUGINS=file:${GXANA_ROOT}/analyses/kpkpxim/simulation/hd_root/hd_root_xim_2018.conf  #hd_root_xim__B4_F1_M23.config #or file:/.../file-to-use which is a configuration file for jana/hd_root 
#====================================================================================
#EVERYTHING BELOW FOR BATCH ONLY

VERBOSE=True
BATCH_SYSTEM=swif2cont #can be swif or condor or osg or qsub adding :[name] will pass -q [name] into PBS.

#environment file location
ENVIRONMENT_FILE=${GXANA_EXTERNALS}/version_sets/recon-2018_01-ver02_32.xml   #change this to your own environment file

WORKFLOW_NAME=kpkpxim_2018-01_gen_amp_V2_2D_ac_YstarRest #SWIF WORKFLOW NAME
# for swif
#PROJECT = gluex          # http://scicomp.jlab.org/scicomp/#/projects
#TRACK= simulation      # https://scicomp.jlab.org/docs/batch_job_tracks

# for swif2
ACCOUNT = halld          # https://scicomp.jlab.org/scicomp/slurmJob/slurmAccount
PARTITION = production   # https://scicomp.jlab.org/scicomp/slurmJob/slurmInfo
EXPERIMENT = GlueX       # GlueX (default) or CPP

# RESOURCES for swif jobs
DISK=5GB            # Max Disk usage
RAM=5GB            # Max RAM usage
TIMELIMIT=12h      # Max walltime.  This may be of the form xx:xx:xx depending on your system
OS=el9