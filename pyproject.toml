[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gxana"
version = "0.1.0"
description = "Toolkit for the GlueX gamma p -> K+ K+ Xi- thesis analysis"
requires-python = ">=3.9"
dependencies = ["pyyaml>=5.4"]

[project.optional-dependencies]
xsection = ["numpy>=1.20", "pandas>=1.3", "jinja2>=3.0"]

[project.scripts]
gxana = "gxana.cli:main"

[tool.setuptools.packages.find]
where = ["packages/common/python", "packages/xsection/python"]
include = ["gxana*"]

[dependency-groups]
dev = ["pytest>=7", "cmake>=3.20", "numpy>=1.20", "pandas>=1.3", "jinja2>=3.0"]

[tool.pytest.ini_options]
testpaths = ["packages/common/tests/python", "packages/xsection/tests/python", "packages/montecarlo/tests", "tests"]
markers = [
    "golden: needs preserved data under $GXANA_ANALYSIS_DATA (skipped when absent)",
    "macros: loads every migrated ROOT macro (needs ROOT)",
    "network: clones public upstream repos (opt-in: GXANA_NETWORK_TESTS=1)",
]
