[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gxana"
version = "1.0.0"
description = "Toolkit for the GlueX gamma p -> K+ K+ Xi- thesis analysis"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Jesse A. Hernandez"}]
dependencies = ["pyyaml>=5.4", "numpy>=1.20", "pandas>=1.3", "jinja2>=3.0"]

[project.scripts]
gxana = "gxana.cli:main"

[tool.setuptools.packages.find]
where = ["packages/common/python", "packages/xsection/python", "packages/barlow/python", "packages/systematics/python", "packages/studies/python"]
include = ["gxana*"]

[dependency-groups]
dev = ["pytest>=7", "cmake>=3.20"]

[tool.pytest.ini_options]
testpaths = ["packages/common/tests/python", "packages/xsection/tests/python", "packages/barlow/tests/python", "packages/systematics/tests/python", "packages/fit/tests/python", "packages/studies/tests/python", "packages/montecarlo/tests", "tests"]
markers = [
    "golden: needs preserved data under $GXANA_ANALYSIS_DATA (skipped when absent)",
    "macros: loads every migrated ROOT macro (needs ROOT)",
    "network: clones public upstream repos (opt-in: GXANA_NETWORK_TESTS=1)",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["packages", "tests", "scripts", "examples"]
exclude = ["packages/qfactors", "_workdir", "archive", "build", "**/.venv", "gluex_analysis_data", "docs", "**/__pycache__"]
extraPaths = ["packages/common/python", "packages/xsection/python", "packages/barlow/python", "packages/systematics/python", "packages/studies/python", "tests/qfactors"]
